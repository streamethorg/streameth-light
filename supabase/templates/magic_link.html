<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#140b36;max-width:480px">
<h2 style="margin:0 0 16px;font-size:20px">Sign in to StreamETH</h2>
<p style="margin:0 0 8px">Your sign-in code:</p>
<p style="margin:0 0 24px;font-size:32px;font-weight:700;letter-spacing:6px;font-family:Menlo,Consolas,monospace">{{ .Token }}</p>
