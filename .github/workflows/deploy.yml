name: Deploy

# Every push to main ships to the VPS: scripts/deploy-vps.sh SSHes in, builds
# the Docker image there and swaps the container. The build runs on the VPS,
# not the runner, so this job is just an SSH session (~8 min).
#
# Secrets: VPS_SSH_KEY (a key in streameth@pblvrt.com's authorized_keys) and
# VPS_KNOWN_HOSTS (`ssh-keyscan pblvrt.com`).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One deploy at a time; a newer push waits rather than racing the build.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        run: scripts/deploy-vps.sh "$GITHUB_REF_NAME"
