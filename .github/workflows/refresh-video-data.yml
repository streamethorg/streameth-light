name: Refresh video data

# Discovers new/upcoming events from Mira and ethereum.org, finds YouTube
# channels for newly-tracked orgs, pulls each tracked channel's current video
# list, backfills metadata/transcripts for just the videos that pull found as
# new (not the whole tracked catalog — see the new-video-ids.json note
# below), classifies videos into real event editions and matches speaker
# names, rebuilds the unified DB, and opens a PR with the diff for review —
# see scripts/fetch-mira-events.py, scripts/fetch-ethereum-org-communities.py,
# scripts/sync-new-orgs.py, scripts/find-youtube-channels.py,
# scripts/guess-youtube-handles.py, scripts/merge-found-channels.py,
# scripts/pull-youtube-videos.py, scripts/pull-youtube-metadata.py,
# scripts/pull-youtube-transcripts.py, scripts/classify-youtube-events.py,
# scripts/extract-youtube-speakers.py, scripts/build-db.mjs.
#
# scripts/pull-youtube-videos.py writes data/sources/new-video-ids.json every
# run — just the video IDs it discovered that weren't already tracked.
# pull-youtube-metadata.py/pull-youtube-transcripts.py pick that file up and
# scope themselves to only those IDs, instead of re-scanning the entire
# tracked catalog (confirmed in CI on 2026-09-29/30, before this existed:
# running them unscoped meant the job spent ~5 hours on a ~14k-video
# historical backlog instead of just the day's new videos, hit the timeout,
# and — because this workflow only commits in its final step — saved none of
# that work either time). Run them by hand without that file present
# (`python3 scripts/pull-youtube-metadata.py`, etc.) to do a manual,
# BATCH_LIMIT-capped backfill of the historical catalog instead.
#
# Also does NOT re-run scripts/remote-export.mjs (the StreamETH session
# export) — that needs VPS SSH access and isn't wired up here.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Discover new events (Mira + ethereum.org)
        run: |
          python3 scripts/fetch-mira-events.py
          python3 scripts/fetch-ethereum-org-communities.py
          python3 scripts/sync-new-orgs.py

      - name: Find YouTube channels for newly-tracked orgs
        run: |
          python3 scripts/find-youtube-channels.py
          python3 scripts/guess-youtube-handles.py
          python3 scripts/merge-found-channels.py

      - name: Pull each tracked channel's current video list
        run: python3 scripts/pull-youtube-videos.py

      - name: Backfill metadata/transcripts for today's new videos only
        run: |
          python3 scripts/pull-youtube-metadata.py
          python3 scripts/pull-youtube-transcripts.py

      - name: Classify events and match speaker names
        run: |
          python3 scripts/classify-youtube-events.py
          python3 scripts/extract-youtube-speakers.py

      - name: Rebuild DB
        run: node scripts/build-db.mjs

      - name: Open PR with refreshed data
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Refresh video data (automated)"
          title: "Refresh video data (automated)"
          body: |
            Daily automated refresh: new events/orgs discovered from Mira and
            ethereum.org, YouTube channels found where possible, each tracked
            channel's current video list pulled, metadata/transcripts
            backfilled for today's new videos only, classified into real
            event editions, speaker names matched, DB rebuilt.

            Review before merging — a scrape run can occasionally misclassify
            an event or channel match.
          branch: automated/refresh-video-data
          delete-branch: true
          add-paths: |
            data/directory.json
            data/sources/*.json
