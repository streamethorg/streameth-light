name: Refresh video data

# Discovers new/upcoming events from Mira and ethereum.org, finds YouTube
# channels for newly-tracked orgs, pulls each tracked channel's current video
# list, classifies videos into real event editions and matches speaker
# names (both pure local title-text processing — no network calls, so no
# timeout risk even though they reprocess the whole catalog), rebuilds the
# unified DB, and opens a PR with the diff for review — see
# scripts/fetch-mira-events.py, scripts/fetch-ethereum-org-communities.py,
# scripts/sync-new-orgs.py, scripts/find-youtube-channels.py,
# scripts/guess-youtube-handles.py, scripts/merge-found-channels.py,
# scripts/pull-youtube-videos.py, scripts/classify-youtube-events.py,
# scripts/extract-youtube-speakers.py, scripts/build-db.mjs.
#
# Deliberately does NOT run scripts/pull-youtube-metadata.py or
# scripts/pull-youtube-transcripts.py — those make one real network request
# per video to backfill extra detail (duration/views/tags, auto-captions)
# across the *entire* tracked catalog, not just newly-discovered videos, so
# they don't belong in a "find what's new" daily job (confirmed in CI on
# 2026-09-29/30: running them here meant the job spent ~5 hours on a
# ~14k-video historical backlog instead of just the day's new videos, hit
# the timeout, and — because this workflow only commits in its final step —
# saved none of that work either time). Run them by hand
# (`python3 scripts/pull-youtube-metadata.py`, etc.) as a separate, one-off
# backfill whenever wanted; they're incremental/resumable on their own.
#
# Also does NOT re-run scripts/remote-export.mjs (the StreamETH session
# export) — that needs VPS SSH access and isn't wired up here.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Discover new events (Mira + ethereum.org)
        run: |
          python3 scripts/fetch-mira-events.py
          python3 scripts/fetch-ethereum-org-communities.py
          python3 scripts/sync-new-orgs.py

      - name: Find YouTube channels for newly-tracked orgs
        run: |
          python3 scripts/find-youtube-channels.py
          python3 scripts/guess-youtube-handles.py
          python3 scripts/merge-found-channels.py

      - name: Pull each tracked channel's current video list
        run: python3 scripts/pull-youtube-videos.py

      - name: Classify events and match speaker names
        run: |
          python3 scripts/classify-youtube-events.py
          python3 scripts/extract-youtube-speakers.py

      - name: Rebuild DB
        run: node scripts/build-db.mjs

      - name: Open PR with refreshed data
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Refresh video data (automated)"
          title: "Refresh video data (automated)"
          body: |
            Daily automated refresh: new events/orgs discovered from Mira and
            ethereum.org, YouTube channels found where possible, each tracked
            channel's current video list pulled, classified into real event
            editions, speaker names matched, DB rebuilt.

            Does not pull per-video metadata/transcripts (duration, views,
            auto-captions) — see the workflow file's header comment for why.
            Run those by hand as a separate backfill.

            Review before merging — a scrape run can occasionally misclassify
            an event or channel match.
          branch: automated/refresh-video-data
          delete-branch: true
          add-paths: |
            data/directory.json
            data/sources/*.json
